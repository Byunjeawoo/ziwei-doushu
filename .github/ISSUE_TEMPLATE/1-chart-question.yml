name: "배반 결과 문의"
description: "명반 결과가 예상과 다르면 출생 정보와 비교 자료를 함께 남겨 주세요."
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "보조성의 밝기, 윤달 귀속, 야자시 날짜 변경은 유파마다 다를 수 있습니다. 어떤 기준으로 비교했는지 알려 주세요."
  - type: input
    id: date
    attributes:
      label: "생년월일 (양력)"
      placeholder: "예: 1990-05-12"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: "태어난 시각"
      placeholder: "예: 08:30"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: "출생지 또는 경도"
      placeholder: "예: 서울 / 동경 126.978도"
    validations:
      required: false
  - type: dropdown
    id: gender
    attributes:
      label: "성별"
      options: ["남성","여성"]
    validations:
      required: true
  - type: textarea
    id: ours
    attributes:
      label: "이 프로젝트의 배반 결과"
      placeholder: "스크린샷 또는 generateChart 출력의 해당 항목"
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: "비교 자료의 출처"
      placeholder: "다른 배반 프로그램 또는 책의 제목과 쪽수"
    validations:
      required: true
  - type: textarea
    id: theirs
    attributes:
      label: "비교 자료의 결과"
      placeholder: "스크린샷 또는 설명"
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: "서로 다른 항목"
      placeholder: "예: 명궁이 묘궁이어야 하는데 술궁으로 표시됩니다."
    validations:
      required: true
