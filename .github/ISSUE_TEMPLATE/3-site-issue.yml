name: "원본 운영 사이트 문의"
description: "ouranic.cn의 로그인·결제·화면 관련 문의"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "이 저장소는 원본에서 파생된 한국어판입니다. 원본 운영 사이트의 계정·결제 문제는 원본 운영자에게 문의해야 합니다."
  - type: input
    id: url
    attributes:
      label: "문제가 발생한 페이지 주소"
      placeholder: "https://ouranic.cn/"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "문제 발생 과정"
      placeholder: "어떤 항목을 입력하거나 누른 뒤 어떤 오류가 나타났나요?"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "브라우저 및 운영체제"
      placeholder: "예: Windows 11 / Chrome"
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "스크린샷"
      placeholder: "전화번호, 인증번호, 다른 사람의 출생 정보는 가려 주세요."
    validations:
      required: false
