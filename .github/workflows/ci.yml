name: 검증
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: 타입 검사 및 배반 회귀 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 타입 검사
        run: npm run typecheck
      - name: 회귀 테스트
        run: npm test
